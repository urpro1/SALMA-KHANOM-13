<html lang="ar" dir="ltr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Laila Restaurant &amp; Café — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cairo:wght@500;600;700;800&family=Tangerine:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --teal-deep:#234c41;
  --teal:#3c7a68;
  --gold-deep:#a9702f;
  --gold:#cf9a4c;
  --gold-light:#e7bd77;
  --cream:#f7ecd7;
  --paper:#fbf4e6;
  --ink:#2c2213;
  --ink-soft:#5c4c33;
}
*{box-sizing:border-box;}
html,body{
  min-height:100%; margin:0; overflow-x:hidden; overflow-y:auto; overscroll-behavior:none;
  background:var(--teal-deep); color:var(--ink);
  font-family:'EB Garamond', serif; font-weight:600;
}
.ar{font-family:'Cairo',sans-serif; direction:rtl; font-weight:700;}
.display{font-family:'Cormorant Garamond', serif; font-weight:700;}
.script{font-family:'Tangerine', cursive;}

.app{ display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }

/* ============ TOP BAR (20%) ============ */
.topbar{
  flex:0 0 auto;
  height:24vh; min-height:160px; max-height:250px;
  position:relative;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  background:
    linear-gradient(155deg, rgba(35,76,65,.86), rgba(60,122,104,.68)),
    linear-gradient(to bottom, transparent 55%, rgba(247,236,215,.22) 100%),
    url('https://commons.wikimedia.org/wiki/Special:FilePath/A%20cozy%20outdoor%20seating%20area%20features%20a%20wooden%20table%20and%20chairs%20under%20a%20tall%20umbrella.jpg?width=1200') center/cover;
  background-color:#4c7f6c;
}
.topbar-wave{position:absolute; left:0; right:0; bottom:-1px; line-height:0; z-index:3; pointer-events:none;}
.topbar-inner{
  position:relative; z-index:2; width:100%; max-width:900px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:0 5vw; color:var(--paper);
}
.tb-brand{display:flex; flex-direction:column; align-items:flex-start; gap:0; flex-shrink:0;}
.tb-brand .script{font-size:2.6rem; line-height:.85; color:var(--paper);}
.tb-brand small{font-family:'Cairo',sans-serif; letter-spacing:.25em; font-size:.55rem; opacity:.85; margin-top:2px;}
.tb-welcome{font-family:'Cairo',sans-serif; font-size:.72rem; opacity:.9; margin-top:6px; letter-spacing:.02em;}

.tb-contact{display:flex; flex-direction:column; gap:6px; align-items:flex-end; text-align:right; font-size:.78rem;}
.tb-contact a{color:var(--paper); text-decoration:none; display:flex; align-items:center; gap:6px; direction:ltr;}
.tb-contact a svg{flex-shrink:0; opacity:.9;}
.tb-contact .addr{font-family:'Cairo',sans-serif; font-size:.7rem; opacity:.9; direction:rtl;}
.tb-social{display:flex; gap:8px; margin-top:2px;}
.tb-social a{
  width:26px; height:26px; border-radius:50%; border:1px solid rgba(251,244,230,.5);
  display:flex; align-items:center; justify-content:center; color:var(--paper);
}

@media(max-width:640px){
  .tb-brand .script{font-size:1.9rem;}
  .tb-welcome{display:none;}
  .tb-contact{font-size:.66rem;}
  .tb-contact .addr{font-size:.6rem;}
  .topbar-inner{padding:0 4vw;}
}

/* ============ BOOK STAGE ============ */
.book-stage{
  flex:0 0 auto; min-height:92vh; position:relative;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(35,76,65,.06), transparent 55%),
    var(--paper);
  display:flex; align-items:center; justify-content:center;
  padding:5vh 0 7vh;
}
.book-stage .texture{position:absolute; inset:0; pointer-events:none;}

#book{
  position:relative;
  perspective:2200px;
  transition:width .5s cubic-bezier(.6,0,.3,1), height .5s cubic-bezier(.6,0,.3,1);
}

/* --- Cover --- */
.cover{
  position:absolute; inset:0; cursor:pointer;
  border-radius:4px;
  background:radial-gradient(ellipse at 50% 32%, #d9a85e 0%, #c98a45 46%, #b8752f 100%);
  box-shadow:0 18px 40px -14px rgba(20,14,4,.55), 0 2px 0 rgba(255,255,255,.15) inset;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; color:var(--paper); overflow:hidden;
  transition:transform .6s cubic-bezier(.6,0,.3,1), opacity .5s ease;
  transform-origin:left center;
}
.cover.opening{transform:rotateY(-115deg); opacity:0; pointer-events:none;}
.cover .moon{
  position:absolute; width:70%; padding-bottom:70%; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, rgba(255,247,228,.5), rgba(255,247,228,.06) 60%, transparent 72%);
  bottom:-30%; left:50%; transform:translateX(-50%);
}
.cover .mark{font-family:'Cairo',sans-serif; letter-spacing:.32em; font-size:.6rem; opacity:.85; z-index:2;}
.cover .script{font-size:3.6rem; line-height:.85; z-index:2; text-shadow:0 6px 22px rgba(40,26,8,.3);}
.cover .sub{font-family:'Cairo',sans-serif; letter-spacing:.35em; font-size:.5rem; color:var(--teal-deep); margin-top:4px; z-index:2;}
.cover .tag{font-style:italic; font-size:.8rem; margin-top:16px; opacity:.9; z-index:2;}
.cover .welcome{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:.85rem; color:var(--teal-deep); margin-top:8px; z-index:2;}
.cover .hint{
  position:absolute; bottom:6%; font-family:'Cairo',sans-serif; font-size:.6rem;
  letter-spacing:.1em; opacity:.8; z-index:2; animation:pulse 2s infinite ease-in-out;
}
@keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.cover-spine{
  position:absolute; left:0; top:0; bottom:0; width:16px;
  background:linear-gradient(90deg, rgba(0,0,0,.35), transparent);
}

/* --- Open book --- */
.spread{
  position:absolute; inset:0; display:flex;
  border-radius:4px; overflow:hidden;
  box-shadow:0 18px 46px -16px rgba(20,14,4,.55);
  opacity:0; pointer-events:none;
  transform:rotateY(0deg); transform-origin:center center;
  transition:opacity .75s ease, transform .75s cubic-bezier(.45,0,.2,1);
  backface-visibility:hidden;
}
.spread.active{opacity:1; pointer-events:auto; transform:rotateY(0deg); z-index:3;}
.spread.exit-fwd{opacity:0; transform:rotateY(-95deg); z-index:1;}
.spread.exit-back{opacity:0; transform:rotateY(95deg); z-index:1;}
.spread.enter-fwd{opacity:0; transform:rotateY(95deg); z-index:2;}
.spread.enter-back{opacity:0; transform:rotateY(-95deg); z-index:2;}
.spread::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg, rgba(0,0,0,.35), transparent 12%, transparent 88%, rgba(0,0,0,.35));
  opacity:0; transition:opacity .75s ease;
}
.spread.exit-fwd::after, .spread.exit-back::after, .spread.enter-fwd::after, .spread.enter-back::after{opacity:1;}
.spread .page{
  flex:1 1 50%; height:100%; overflow-y:auto; overflow-x:hidden;
  padding:4.5% 5%; position:relative;
  -webkit-overflow-scrolling:touch;
}
.spread .page::-webkit-scrollbar{width:4px;}
.spread .page::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:4px;}
.spread .page.left{ box-shadow: inset -10px 0 18px -14px rgba(0,0,0,.35); }
.spread .page.right{ box-shadow: inset 10px 0 18px -14px rgba(0,0,0,.35); }
.page.band-teal{background:linear-gradient(155deg,var(--teal-deep),var(--teal) 70%); color:var(--paper);}
.page.band-gold{background:linear-gradient(155deg,#e3ab5f,#c1934d 70%); color:var(--ink);}
.page.band-cream{background:var(--paper); color:var(--ink);}
.page.blank{display:flex; align-items:center; justify-content:center;}

.tap-zone{position:absolute; top:0; bottom:0; width:16%; z-index:5; cursor:pointer;}
.tap-zone.tz-left{left:0;}
.tap-zone.tz-right{right:0;}

.page-run{
  font-family:'Cairo',sans-serif; font-size:.6rem; letter-spacing:.15em; text-align:center;
  opacity:.75; margin-bottom:6px; text-transform:uppercase;
}
.page-title{text-align:center; margin-bottom:8px;}
.page-title h3.display{font-size:1.5rem; margin:0; font-weight:700; line-height:1.1;}
.page-title .ar{font-size:.95rem; display:block; margin-top:2px;}
.page-title .rule{width:34px; height:2px; background:currentColor; opacity:.4; margin:6px auto 0; border-radius:2px;}

.group-title{font-size:1rem; font-weight:700; text-align:center; margin:6px 0 6px;}
.group-title .ar{font-size:.76rem; display:block; opacity:.9; font-weight:600; margin-top:1px;}

.row{padding:5px 0; border-bottom:1px dashed currentColor; opacity:1; font-size:.86rem;}
.row:last-child{border-bottom:none;}
.row-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.row-name{font-weight:700; line-height:1.22;}
.row-name .ar{font-size:.86em; font-weight:700; opacity:.92; display:block; margin-top:1px;}
.row-price{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:1.05em; white-space:nowrap;}
.row-desc{font-size:.82em; font-weight:600; font-style:italic; opacity:.88; margin-top:1px; line-height:1.32;}

.page-num{
  position:absolute; bottom:2%; left:0; right:0; text-align:center;
  font-family:'Cormorant Garamond',serif; font-size:.7rem; opacity:.55; font-weight:700;
}

.photo-tip{
  width:64px; height:64px; margin:0 auto 6px; position:relative;
  filter:drop-shadow(0 6px 10px rgba(20,14,4,.3));
}
.photo-tip img{width:100%; height:100%; object-fit:cover; display:block;}
.photo-tip.torn-a img,.photo-tip.torn-a{clip-path:polygon(3% 12%,9% 4%,18% 9%,27% 2%,38% 8%,47% 1%,58% 7%,68% 2%,79% 9%,89% 3%,97% 11%,100% 22%,94% 33%,99% 44%,93% 55%,98% 67%,91% 77%,96% 88%,86% 96%,75% 91%,64% 98%,53% 92%,42% 99%,31% 93%,20% 98%,10% 90%,2% 95%,0% 83%,6% 71%,1% 60%,7% 49%,2% 38%,8% 27%,1% 19%);}
.photo-tip.torn-b img,.photo-tip.torn-b{clip-path:polygon(6% 2%,16% 8%,25% 1%,36% 7%,46% 2%,57% 9%,66% 3%,77% 8%,88% 1%,96% 10%,100% 21%,95% 32%,100% 43%,94% 54%,99% 66%,92% 76%,97% 87%,88% 97%,77% 92%,66% 99%,55% 93%,44% 98%,33% 91%,22% 97%,11% 92%,1% 96%,4% 84%,0% 72%,5% 60%,1% 48%,6% 37%,0% 25%,4% 14%);}
.photo-cap{text-align:center; font-size:.55rem; font-style:italic; opacity:.6; margin-top:-6px; margin-bottom:6px;}

/* --- Nav arrows --- */
.book-nav{
  position:absolute; top:50%; transform:translateY(-50%); z-index:10;
  width:38px; height:38px; border-radius:50%; border:1px solid rgba(44,34,19,.25);
  background:rgba(251,244,230,.85); color:var(--teal-deep);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 6px 14px rgba(20,14,4,.2); opacity:0; pointer-events:none; transition:opacity .3s;
}
.book-nav.show{opacity:1; pointer-events:auto;}
.book-nav.prev{left:calc(50% - 46vh - 26px);}
.book-nav.next{right:calc(50% - 46vh - 26px);}
@media(max-width:900px){
  .book-nav.prev{left:6px;}
  .book-nav.next{right:6px;}
}

.book-close{
  position:absolute; top:-14px; right:-14px; z-index:11;
  width:30px; height:30px; border-radius:50%; background:var(--teal-deep); color:var(--gold-light);
  border:1px solid rgba(231,189,119,.5); display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:.85rem; opacity:0; pointer-events:none; transition:opacity .3s;
}
.book-close.show{opacity:1; pointer-events:auto;}

.page-indicator{
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  font-family:'Cairo',sans-serif; font-size:.62rem; color:var(--ink-soft); opacity:0; transition:opacity .3s;
  background:rgba(251,244,230,.85); padding:3px 10px; border-radius:999px;
}
.page-indicator.show{opacity:.85;}

.site-footer{
  flex:0 0 auto; background:var(--teal-deep); color:var(--cream);
  text-align:center; padding:5vh 20px 6vh;
}
.site-footer .script{font-size:2rem; color:var(--gold-light); display:block;}
.site-footer div{font-family:'Cairo',sans-serif; font-size:.7rem; opacity:.75; margin-top:6px; letter-spacing:.03em;}
</style>
</head>

/* ================= PAGINATION ================= */
function paginate(sections){
  const pages = [];
  sections.forEach(sec=>{
    const secEn = sec.titleEn.replace(/&amp;/g,'&');
    let introDone = false;
    sec.groups.forEach(g=>{
      const items = g.items;
      let idx = 0;
      let firstChunkOfGroup = true;
      while(idx < items.length){
        const isVeryFirst = !introDone;
        const limit = isVeryFirst ? 4 : 6;
        const chunk = items.slice(idx, idx+limit);
        idx += limit;
        pages.push({
          sectionId: sec.id,
          sectionTitleEn: secEn,
          sectionTitleAr: sec.titleAr,
          groupTitleEn: firstChunkOfGroup ? (g.titleEn||null) : null,
          groupTitleAr: firstChunkOfGroup ? (g.titleAr||null) : null,
          items: chunk,
          showSectionTitle: isVeryFirst,
          showPhoto: isVeryFirst,
          img: isVeryFirst ? sec.img : null,
        });
        introDone = true;
        firstChunkOfGroup = false;
      }
    });
    if(sec.note && pages.length){
      pages[pages.length-1].note = sec.note;
    }
  });
  pages.push({closing:true});
  return pages;
}

    <div class="row-top">
      <div class="row-name">${it.en}<span class="ar">${it.ar}</span></div>
      <div class="row-price">${it.price} <span style="font-size:.7em;opacity:.7;">J.D</span></div>
    </div>
    ${it.desc?`<div class="row-desc">${it.desc}</div>`:''}
  </div>`;
}

function renderContentPage(p, band, pageNum){
  let html = `<div class="page-run">${p.sectionTitleEn}</div>`;
  if(p.showSectionTitle){
    html += `<div class="page-title"><h3 class="display">${p.sectionTitleEn}</h3><span class="ar">${p.sectionTitleAr}</span><div class="rule"></div></div>`;
  }
  if(p.showPhoto && p.img){
    html += `<div class="photo-tip torn-a"><img src="${p.img}" loading="lazy" alt=""></div>`;
  }
  if(p.groupTitleEn){
    html += `<div class="group-title">${p.groupTitleEn}<span class="ar">${p.groupTitleAr||''}</span></div>`;
  }
  html += p.items.map(renderRow).join('');
  if(p.note){
    html += `<div style="font-size:.6rem;opacity:.6;text-align:center;margin-top:10px;font-style:italic;">${p.note}</div>`;
  }
  html += `<div class="page-num">${pageNum}</div>`;
  return `<div class="page band-${band}">${html}</div>`;
}

function renderClosingPage(band){
  return `<div class="page band-${band}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
    <div class="script" style="font-size:2.4rem;">Laila</div>
    <div style="font-family:'Cairo',sans-serif; font-size:.62rem; letter-spacing:.25em; opacity:.8; margin-top:2px;">RESTAURANT &amp; CAFÉ</div>
    <div style="font-style:italic; font-size:.8rem; margin-top:16px; opacity:.9;">Thank you for dining with us</div>
    <div class="ar" style="font-size:.72rem; margin-top:4px; opacity:.9;">شكراً لزيارتكم</div>
    <div style="width:34px;height:2px;background:currentColor;opacity:.4;margin:16px auto;border-radius:2px;"></div>
    <div style="font-family:'Cairo',sans-serif; font-size:.65rem; opacity:.85; direction:ltr;">0792345655</div>
    <div class="ar" style="font-size:.62rem; opacity:.8; margin-top:3px;">Mecca Street - behind Hejaz Towers</div>
    <div style="font-family:'Cairo',sans-serif; font-size:.62rem; opacity:.8; margin-top:6px;">@laila.restaurantcafe</div>
  </div>`;
}

function renderBlankPage(band){
  return `<div class="page band-${band} blank">
    <svg width="46" height="46" viewBox="0 0 40 40" style="opacity:.35">
      <path d="M8 30 C8 14 22 6 34 8 C32 22 22 34 8 30 Z" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path d="M8 30 L26 12" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </svg>
  </div>`;
}

/* Build spreads: pair pages 0&1, 2&3, ... */
const spreadsRoot = document.getElementById('spreadsRoot');
const totalSpreads = Math.ceil(PAGES.length/2);
let spreadEls = [];

for(let s=0; s<totalSpreads; s++){
  const leftBand = BAND_CYCLE[s%3];
  const rightBand = BAND_CYCLE[(s+1)%3];
  const leftPage = PAGES[s*2];
  const rightPage = PAGES[s*2+1];

  const leftHtml = leftPage
    ? (leftPage.closing ? renderClosingPage(leftBand) : renderContentPage(leftPage, leftBand, s*2+1))
    : renderBlankPage(leftBand);
  const rightHtml = rightPage
    ? (rightPage.closing ? renderClosingPage(rightBand) : renderContentPage(rightPage, rightBand, s*2+2))
    : renderBlankPage(rightBand);

  const div = document.createElement('div');
  div.className = 'spread';
  div.innerHTML = wrapPage(leftHtml, 'left') + wrapPage(rightHtml, 'right')
    + '<div class="tap-zone tz-left" title="Previous"></div>'
    + '<div class="tap-zone tz-right" title="Next"></div>';
  spreadsRoot.appendChild(div);
  spreadEls.push(div);
}

function wrapPage(innerPageHtml, side){
  // innerPageHtml already is a full `<div class="page band-x ...">...</div>` string; inject side class
  return innerPageHtml.replace('class="page', `class="page ${side}`);
}

/* ================= BOOK CONTROLLER ================= */
const bookStage = document.getElementById('bookStage');
const book = document.getElementById('book');
const cover = document.getElementById('cover');
const navPrev = document.getElementById('navPrev');
const navNext = document.getElementById('navNext');
const navClose = document.getElementById('navClose');
const pageIndicator = document.getElementById('pageIndicator');

let currentSpread = 0;
let isOpen = false;
let animating = false;

function sizeBook(mode){
  const rect = bookStage.getBoundingClientRect();
  const availW = rect.width * 0.86;
  const availH = rect.height * 0.86;
  const aspect = mode === 'open' ? (3/2) : (3/4); // width/height
  let h = availH;
  let w = h * aspect;
  if(w > availW){ w = availW; h = w / aspect; }
  book.style.width = w + 'px';
  book.style.height = h + 'px';
}

function updateNav(){
  navPrev.classList.toggle('show', isOpen && currentSpread > 0);
  navNext.classList.toggle('show', isOpen && currentSpread < totalSpreads-1);
  navClose.classList.toggle('show', isOpen);
  pageIndicator.classList.toggle('show', isOpen);
  pageIndicator.textContent = (currentSpread+1) + ' / ' + totalSpreads;
}

function showSpread(idx){
  spreadEls.forEach((el,i)=> el.classList.toggle('active', i===idx));
  currentSpread = idx;
  updateNav();
}

/* Real page-turn transition between two spreads */
function turnTo(idx, direction){
  if(animating || idx<0 || idx>=totalSpreads || idx===currentSpread) return;
  animating = true;
  const oldEl = spreadEls[currentSpread];
  const newEl = spreadEls[idx];
  const exitCls = direction==='fwd' ? 'exit-fwd' : 'exit-back';
  const enterCls = direction==='fwd' ? 'enter-fwd' : 'enter-back';

  newEl.classList.add(enterCls);
  // force reflow so the enter starting transform applies before animating to active
  void newEl.offsetWidth;

  oldEl.classList.remove('active');
  oldEl.classList.add(exitCls);
  newEl.classList.remove(enterCls);
  newEl.classList.add('active');

  currentSpread = idx;
  updateNav();

  setTimeout(()=>{
    oldEl.classList.remove(exitCls, 'active');
    animating = false;
  }, 780);
}

function goNext(){ if(currentSpread<totalSpreads-1) turnTo(currentSpread+1, 'fwd'); }
function goPrev(){ if(currentSpread>0) turnTo(currentSpread-1, 'back'); }

function openBook(){
  isOpen = true;
  cover.classList.add('opening');
  sizeBook('open');
  setTimeout(()=>{
    cover.style.visibility = 'hidden';
    showSpread(0);
  }, 520);
}

function closeBook(){
  isOpen = false;
  spreadEls.forEach(el => el.classList.remove('active','exit-fwd','exit-back','enter-fwd','enter-back'));
  cover.style.visibility = 'visible';
  cover.classList.remove('opening');
  sizeBook('closed');
  currentSpread = 0;
  updateNav();
}

cover.addEventListener('click', openBook);
navClose.addEventListener('click', closeBook);
navPrev.addEventListener('click', goPrev);
navNext.addEventListener('click', goNext);

/* Tap the corner/edge of a page to flip it, like a real book */
spreadsRoot.addEventListener('click', (e)=>{
  if(!isOpen) return;
  const zone = e.target.closest('.tap-zone');
  if(!zone) return;
  if(zone.classList.contains('tz-right')) goNext();
  else goPrev();
});

document.addEventListener('keydown', (e)=>{
  if(!isOpen) return;
  if(e.key==='ArrowLeft') goPrev();
  if(e.key==='ArrowRight') goNext();
  if(e.key==='Escape') closeBook();
});

let touchStartX = null;
book.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
book.addEventListener('touchend', e=>{
  if(touchStartX===null || !isOpen) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 60){
    if(dx < 0) goNext(); else goPrev();
  }
  touchStartX = null;
}, {passive:true});

window.addEventListener('resize', ()=> sizeBook(isOpen ? 'open' : 'closed'));

sizeBook('closed');
updateNav();
</script>
